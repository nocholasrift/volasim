# ROS2 side (bridge + controller) talking to a sim on the host. See README.md.
services:
  ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: volasim/ros2:humble
    environment:
      - VOLASIM_SIM_HOST=host.docker.internal  # reach the sim's PUB on the host
      - AUTO_TAKEOFF=${AUTO_TAKEOFF:-0}
      - RECORD=${RECORD:-0}                    # 1 = record an MCAP bag to ./bags
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    ports:
      - "5557:5557"  # bridge PUB, so host sim can connect to localhost:5557
    volumes:
      - ../bags:/ws/bags  # recorded bags land in <repo>/bags on the host
      # Cloud stream: the bridge prefers ipc and falls back to tcp on its own,
      # so nothing here is required. On a NATIVE LINUX Docker host you can keep
      # it on ipc (no tcp copy) by sharing the socket and pointing the bridge at
      # it — uncomment both lines below. This does NOT work under Docker Desktop
      # (macOS/Windows): a unix socket cannot cross the host<->VM boundary, so
      # there the bridge stays on the tcp fallback.
      # - /tmp/volasim_cloud:/tmp/volasim_cloud
    # environment override for the ipc case above:
    #   - VOLASIM_CLOUD_ENDPOINT=ipc:///tmp/volasim_cloud
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; no-op on Docker Desktop
    restart: unless-stopped
