name: Multi-OS Cross-Architecture CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  test-matrix:
    name: ${{ matrix.os-name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Ubuntu 22.04 (LTS) ---
          - os-name: "Ubuntu 22.04"
            arch: "intel-x64"
            runner: ubuntu-22.04
          - os-name: "Ubuntu 22.04"
            arch: "arm64"
            runner: ubuntu-22.04-arm

          # --- Ubuntu 24.04 (LTS) ---
          - os-name: "Ubuntu 24.04"
            arch: "intel-x64"
            runner: ubuntu-24.04
          - os-name: "Ubuntu 24.04"
            arch: "arm64"
            runner: ubuntu-24.04-arm

          # --- Ubuntu 26.04 (Public Preview) ---
          - os-name: "Ubuntu 26.04"
            arch: "intel-x64"
            runner: ubuntu-26.04
          - os-name: "Ubuntu 26.04"
            arch: "arm64"
            runner: ubuntu-26.04-arm

          # --- macOS ---
          - os-name: "macOS"
            arch: "intel-x64"
            runner: macos-13
          - os-name: "macOS"
            arch: "arm64"
            runner: macos-latest

    steps:
      # Step 1: Download code to the active runner machine
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Print system information
      - name: Verify Architecture and OS
        run: |
          echo "Operating System Family: $RUNNER_OS"
          echo "Actual Kernel Machine Architecture:"
          uname -m

      # Step 3: Install minimal build essentials for Linux environments
      - name: Install System Dependencies (Linux Only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libudev-dev

      # Step 4: Setup CMake and Ninja build tools
      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      # Step 5: Set up caching for vcpkg binary dependencies
      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ matrix.arch }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-vcpkg-

      # Step 6: Ensure the cache directory exists before running CMake
      - name: Create vcpkg cache directory
        run: mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}

      # Step 7: Configure CMake build directory
      # Added -DSDL_VIDEO=OFF and -DSDL_UNIX_CONSOLE_BUILD=ON to skip X11/Wayland checks
      - name: Configure CMake
        run: |
          cmake -B build/ -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DSDL_VIDEO=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON

      # Step 8: Run the compilation build step
      - name: Build Project
        run: cmake --build build/ --config Release

      # Step 9: Execute your CTest test suite
      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release

