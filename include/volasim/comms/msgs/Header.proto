syntax = "proto3";

package volasim_msgs;

// Fields shared across message types: who produced the message, when, and which
// coordinate frame the data is expressed in. Modeled on ROS std_msgs/Header so
// the bridge maps it straight through.
//
// Sensor pose is deliberately NOT here. Transforms are broadcast separately as a
// /tf-style message (a list of transforms) and resolved by frame_id, matching
// how ROS decouples data from the transform tree.
message Header {
  int64  stamp_ns  = 1;
  uint32 drone_id  = 2;
  uint32 sensor_id = 3;  // 0 for messages not tied to a specific sensor
  string frame_id  = 4;
}
