repos:
  # 1. Official repository for the Black Python formatter
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        types: [python]

  # 2. Official mirror repository for Clang-Format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
        # This tells the tool to look for your local .clang-format file
        args: ["-style=file"] 

